<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordine perfetto · Alice Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe3; --card:#fffaf1; --ink:#2b2420; --muted:#7a6c60; --line:#e6d9c5;
  --accent:#c8402a; --accent-ink:#fff; --chip:#efe3cf; --shadow:0 6px 20px rgba(60,40,20,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e1a17; --card:#2a2420; --ink:#f3eadb; --muted:#b2a392; --line:#40362d;
    --accent:#e0553d; --accent-ink:#fff; --chip:#3a3028; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1e1a17; --card:#2a2420; --ink:#f3eadb; --muted:#b2a392; --line:#40362d;
  --accent:#e0553d; --accent-ink:#fff; --chip:#3a3028; --shadow:0 6px 20px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:28px 18px 40px}
main{width:100%;max-width:440px}
header{text-align:center;margin-bottom:22px}
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:800;font-size:34px;line-height:1.1;margin:8px 0 6px}
h1 em{color:var(--accent);font-style:italic}
.sub{color:var(--muted);font-size:15px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.label{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:12px 0 10px}
.stepper button{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);
  font-size:28px;line-height:1;cursor:pointer;transition:transform .12s;font-family:inherit}
.stepper button:active{transform:scale(.92)}
.stepper button:disabled{opacity:.35;cursor:default}
.count{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:72px;min-width:90px;text-align:center;line-height:1}
.people{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:22px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);opacity:.85;animation:pop .25s ease both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
input[type=range]{width:100%;margin:18px 0 2px;accent-color:var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.results{display:grid;gap:12px;margin-top:16px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.ico{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--chip);display:grid;place-items:center;flex:none}
.name{flex:1}
.name b{display:block;font-size:17px}
.name span{font-size:13px;color:var(--muted)}
.num{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:38px;color:var(--accent);min-width:48px;text-align:right}
.bump{animation:bump .3s ease}
@keyframes bump{50%{transform:scale(1.18)}}
.copy{margin-top:18px;width:100%;padding:15px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);
  font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .12s}
.copy:active{transform:scale(.98)}
details{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
summary{cursor:pointer;padding:12px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"⚙︎";color:var(--muted)}
.fields{display:grid;gap:12px;padding:4px 0 14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field label{font-size:14px;line-height:1.3}
.field label small{display:block;color:var(--muted);font-size:12px}
.field input{width:84px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);
  font-size:16px;font-family:inherit;text-align:center}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.field input.bad{border-color:var(--accent)}
.reset{width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--muted);
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px}
.formula{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<main>
  <header>
    <div class="kicker">Serata pizza</div>
    <h1>L'ordine <em>perfetto</em><br>da Alice Pizza</h1>
    <p class="sub">Dimmi in quanti siete, al resto pensiamo noi.</p>
  </header>

  <section class="card">
    <div class="label">Quante persone?</div>
    <div class="stepper">
      <button id="minus" aria-label="Meno">−</button>
      <div class="count" id="count">4</div>
      <button id="plus" aria-label="Più">+</button>
    </div>
    <div class="people" id="people"></div>
    <input type="range" id="range" step="1" aria-label="Numero di persone">
    <div class="scale"><span id="smin"></span><span id="smax"></span></div>
  </section>

  <section class="results">
    <div class="row"><div class="ico">🍕</div><div class="name"><b>Teglie</b><span id="d-teglie"></span></div><div class="num" id="teglie">0</div></div>
    <div class="row"><div class="ico">🍙</div><div class="name"><b>Supplì</b><span id="d-suppli"></span></div><div class="num" id="suppli">0</div></div>
    <div class="row"><div class="ico">🥔</div><div class="name"><b>Crocchette</b><span id="d-crocchette"></span></div><div class="num" id="crocchette">0</div></div>
  </section>

  <button class="copy" id="copy">Copia l'ordine</button>

  <details id="settings">
    <summary>Impostazioni</summary>
    <div class="fields">
      <div class="field"><label for="c-teglia">Persone per teglia<small>teglie = ⌈N ÷ valore⌉</small></label><input id="c-teglia" inputmode="decimal"></div>
      <div class="field"><label for="c-crocchetta">Persone per crocchetta<small>crocchette = ⌈N ÷ valore⌉</small></label><input id="c-crocchetta" inputmode="decimal"></div>
      <div class="field"><label for="c-suppli">Supplì a persona<small>supplì = ⌈N × valore⌉</small></label><input id="c-suppli" inputmode="decimal"></div>
      <div class="field"><label for="c-min">Minimo persone</label><input id="c-min" inputmode="numeric"></div>
      <div class="field"><label for="c-max">Massimo persone</label><input id="c-max" inputmode="numeric"></div>
    </div>
    <div class="formula" id="formula"></div>
    <button class="reset" id="reset">Ripristina valori iniziali</button>
  </details>
  <footer id="foot"></footer>
</main>

<script>
(function(){
  var DEFAULTS={teglia:4.2, crocchetta:3, suppli:1, min:3, max:9};
  var KEY='alice-pizza-config';
  var cfg=load();
  var n=4, last={};
  var $=function(id){return document.getElementById(id)};

  function load(){
    var c=Object.assign({},DEFAULTS);
    try{
      var s=localStorage.getItem(KEY);
      if(s){var o=JSON.parse(s); for(var k in DEFAULTS){ if(typeof o[k]==='number'&&isFinite(o[k])) c[k]=o[k]; }}
    }catch(e){}
    return valid(c)?c:Object.assign({},DEFAULTS);
  }
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){} }
  function valid(c){ return c.teglia>0&&c.crocchetta>0&&c.suppli>0&&c.min>=1&&c.max>=c.min; }
  function fmt(x){ return String(Math.round(x*100)/100).replace('.',','); }
  function parse(v){ var x=parseFloat(String(v).trim().replace(',','.')); return isFinite(x)?x:NaN; }

  function calc(p){
    return {
      teglie: Math.ceil(p/cfg.teglia),
      suppli: Math.ceil(p*cfg.suppli),
      crocchette: Math.ceil(p/cfg.crocchetta)
    };
  }
  function setNum(id,v){
    var el=$(id);
    if(last[id]!==v){ el.textContent=v; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); last[id]=v; }
  }
  function render(){
    n=Math.max(cfg.min,Math.min(cfg.max,n));
    var r=calc(n);
    $('count').textContent=n;
    var rg=$('range'); rg.min=cfg.min; rg.max=cfg.max; rg.value=n;
    $('smin').textContent=cfg.min; $('smax').textContent=cfg.max;
    $('minus').disabled=n<=cfg.min; $('plus').disabled=n>=cfg.max;
    var pp=$('people'); pp.innerHTML='';
    for(var i=0;i<n;i++){var d=document.createElement('span');d.className='dot';d.style.animationDelay=(i*25)+'ms';pp.appendChild(d)}
    setNum('teglie',r.teglie); setNum('suppli',r.suppli); setNum('crocchette',r.crocchette);
    $('d-teglie').textContent='circa '+fmt(cfg.teglia)+' persone a teglia';
    $('d-suppli').textContent=cfg.suppli===1?'uno a testa':fmt(cfg.suppli)+' a persona';
    $('d-crocchette').textContent=cfg.crocchetta===1?'una a testa':'una ogni '+fmt(cfg.crocchetta)+' persone';
    $('formula').innerHTML='teglie = ⌈N / '+fmt(cfg.teglia)+'⌉<br>supplì = ⌈N × '+fmt(cfg.suppli)+'⌉<br>crocchette = ⌈N / '+fmt(cfg.crocchetta)+'⌉<br>'+(cfg.min-1)+' &lt; N &lt; '+(cfg.max+1);
    $('foot').textContent='Valido da '+cfg.min+' a '+cfg.max+' persone';
  }
  function fillInputs(){
    $('c-teglia').value=fmt(cfg.teglia); $('c-crocchetta').value=fmt(cfg.crocchetta); $('c-suppli').value=fmt(cfg.suppli);
    $('c-min').value=cfg.min; $('c-max').value=cfg.max;
    ['c-teglia','c-crocchetta','c-suppli','c-min','c-max'].forEach(function(i){$(i).classList.remove('bad')});
  }
  function readInputs(){
    var c={
      teglia:parse($('c-teglia').value), crocchetta:parse($('c-crocchetta').value), suppli:parse($('c-suppli').value),
      min:Math.round(parse($('c-min').value)), max:Math.round(parse($('c-max').value))
    };
    var ok={
      'c-teglia':c.teglia>0, 'c-crocchetta':c.crocchetta>0, 'c-suppli':c.suppli>0,
      'c-min':c.min>=1, 'c-max':c.max>=c.min
    };
    var all=true;
    for(var id in ok){ $(id).classList.toggle('bad',!ok[id]); if(!ok[id]) all=false; }
    if(all){ cfg=c; save(); render(); }
  }

  $('minus').onclick=function(){n--;render()};
  $('plus').onclick=function(){n++;render()};
  $('range').oninput=function(){n=parseInt(this.value,10);render()};
  ['c-teglia','c-crocchetta','c-suppli','c-min','c-max'].forEach(function(i){$(i).addEventListener('input',readInputs)});
  $('reset').onclick=function(){cfg=Object.assign({},DEFAULTS);save();fillInputs();render()};

  $('copy').onclick=function(){
    var r=calc(n), btn=this;
    var t='Ordine Alice Pizza per '+n+' persone:\n🍕 Teglie: '+r.teglie+'\n🍙 Supplì: '+r.suppli+'\n🥔 Crocchette: '+r.crocchette;
    function ok(){btn.textContent='Copiato! 🍕'; setTimeout(function(){btn.textContent="Copia l'ordine"},1600)}
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){})} }catch(e){}
  };

  fillInputs(); render();
})();
</script>
</body>
</html>
